plugins {
    id 'com.android.application'
}

android {
    namespace 'sa.minjaz.preview'
    compileSdk 36

    defaultConfig {
        applicationId "sa.minjaz.preview"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "0.3-compat-only"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
