<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة إدارة الخدمات الرقمية | منجاز</title><style>
:root{color-scheme:dark;font-family:system-ui,"Segoe UI",sans-serif}*{box-sizing:border-box}
body{margin:0;background:#0b1022;color:#f4f5ff}header{background:linear-gradient(120deg,#302364,#141c38);padding:24px max(18px,calc((100vw - 1160px)/2))}.wrap{max-width:1160px;margin:auto;padding:24px 18px}h1{margin:6px 0}p{color:#bfcae2;line-height:1.8}a{color:#c8bdff}button,select,textarea{font:inherit;border-radius:10px;padding:10px 13px}button{background:#8067e9;color:#fff;border:0;cursor:pointer}button:hover{filter:brightness(1.1)}button:disabled{opacity:.6;cursor:wait}select,textarea{background:#151b35;color:white;border:1px solid #3c4664}textarea{width:100%;min-height:110px;resize:vertical}.card{border:1px solid #38405b;border-radius:15px;background:#181f38;padding:19px;margin:15px 0}.row{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.muted{color:#abb8d2}.error{color:#ffb1b1}.good{color:#a9edca}.badge{border-radius:20px;padding:5px 12px;background:#35315c;color:#eee3ff;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}ul{padding-inline-start:24px}li{margin:8px 0}button.secondary{background:#334364}button.danger{background:#953b4d}</style></head><body>
<header><span class="badge">نسخة تجريبية — لا توجد معاملات دفع</span><h1>إدارة خدمات منجاز الرقمية</h1><p>إدارة مسودات العملاء ومراحل التنفيذ والتسليم وطلبات التعديل.</p><a href="/digital-services">العودة إلى متجر الخدمات</a></header>
<main class="wrap"><div class="row"><h2>الطلبات الرقمية</h2><div><label for="filter">تصفية الحالة: </label><select id="filter"><option value="">جميع الحالات</option><option value="draft">مسودة</option><option value="in_progress">قيد التنفيذ</option><option value="delivered">تم التسليم</option><option value="revision_requested">طلب تعديل</option><option value="completed">مكتمل</option><option value="cancelled">ملغي</option></select> <button id="refresh">تحديث</button></div></div>
<p id="message" role="status">جاري تحميل الطلبات...</p><section id="orders" class="grid" aria-live="polite"></section><section id="details" aria-live="polite"></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const labels={draft:'مسودة',in_progress:'قيد التنفيذ',delivered:'تم التسليم',revision_requested:'طلب تعديل',completed:'مكتمل',cancelled:'ملغي',paid:'مدفوع',awaiting_payment:'بانتظار الدفع',refunded:'مسترد'};
const transitions={draft:[['in_progress','بدء التنفيذ'],['cancelled','إلغاء المسودة']],in_progress:[['delivered','تسليم الخدمة']],revision_requested:[['in_progress','استئناف التنفيذ']]};
let currentId=null;
function el(tag,value,cls){const node=document.createElement(tag);if(value!==undefined)node.textContent=value;if(cls)node.className=cls;return node}
async function api(path,opts={}){const response=await fetch(path,{credentials:'same-origin',headers:{Accept:'application/json',...(opts.body?{'Content-Type':'application/json'}:{})},...opts});let data;try{data=await response.json()}catch{throw Error('تعذر قراءة استجابة الخادم')}if(!response.ok)throw Error(response.status===401?'يرجى تسجيل الدخول بحساب مدير':response.status===403?'لا تملك صلاحية المدير':data.error||'حدث خطأ');return data}
function message(text,error=false){$('message').textContent=text;$('message').className=error?'error':'good'}
async function load(){const list=$('orders');list.replaceChildren();message('جاري تحميل الطلبات...');try{const filter=$('filter').value;const data=await api('/api/digital-services/admin/orders'+(filter?'?status='+encodeURIComponent(filter):''));if(!Array.isArray(data.orders))throw Error('بيانات غير صحيحة');message('عدد الطلبات المعروضة: '+data.orders.length);if(!data.orders.length)list.append(el('p','لا توجد طلبات لهذه الحالة.'));for(const order of data.orders){const c=el('article',undefined,'card');c.append(el('h3',order.title_ar),el('p','طلب #'+order.id+' — '+(labels[order.status]||order.status)),el('p','رقم العميل: '+order.customer_id+' • '+order.price_sar+' ر.س'));const btn=el('button','إدارة الطلب');btn.addEventListener('click',()=>details(order.id));c.append(btn);list.append(c)}}catch(e){message(e.message,true)}}
async function details(id){currentId=id;const box=$('details');box.replaceChildren(el('p','جاري تحميل تفاصيل الطلب...'));try{const payload=await api('/api/digital-services/admin/orders/'+encodeURIComponent(id));if(currentId!==id)return;const o=payload.order;const c=el('article',undefined,'card');c.append(el('h2',o.title_ar+' — طلب #'+o.id),el('p','العميل: '+o.customer_id+' | الحالة: '+(labels[o.status]||o.status)),el('p','السعر: '+o.price_sar+' ر.س | حد التعديلات: '+o.revision_limit),el('h3','متطلبات العميل'),el('pre',o.requirements));if(o.delivery_note)c.append(el('h3','ملاحظة التسليم'),el('pre',o.delivery_note));const choices=transitions[o.status]||[];if(choices.length){c.append(el('h3','الإجراء التالي'));const field=el('textarea');field.placeholder='ملاحظة تسليم مفصلة (إلزامية عند التسليم، 10 أحرف على الأقل)';field.maxLength=3000;c.append(field);for(const [status,title] of choices){const btn=el('button',title,status==='cancelled'?'danger':'secondary');btn.style.marginInlineEnd='8px';btn.addEventListener('click',async()=>{if(status==='delivered'&&field.value.trim().length<10){message('اكتب ملاحظة تسليم لا تقل عن 10 أحرف',true);return}if(status==='cancelled'&&!confirm('تأكيد إلغاء هذه المسودة التجريبية؟'))return;btn.disabled=true;try{await api('/api/digital-services/admin/orders/'+o.id,{method:'PATCH',body:JSON.stringify({status,note:field.value.trim()})});message('تم تحديث حالة الطلب #'+o.id);await load();await details(o.id)}catch(err){message(err.message,true)}finally{btn.disabled=false}});c.append(btn)}}if(payload.revisions?.length){c.append(el('h3','طلبات التعديل'));const ul=el('ul');for(const rev of payload.revisions){ul.append(el('li',rev.note+' — '+new Date(rev.created_at).toLocaleString('ar-SA')))}c.append(ul)}if(payload.events?.length){c.append(el('h3','سجل الحالات'));const ul=el('ul');for(const ev of payload.events){ul.append(el('li',(labels[ev.previous_status]||ev.previous_status)+' ← '+(labels[ev.new_status]||ev.new_status)+' — '+new Date(ev.created_at).toLocaleString('ar-SA')+(ev.note?' • '+ev.note:'')))}c.append(ul)}box.replaceChildren(c)}catch(e){if(currentId===id)box.replaceChildren(el('p',e.message,'error'))}}
$('refresh').addEventListener('click',load);$('filter').addEventListener('change',load);load();
</script></body></html>
