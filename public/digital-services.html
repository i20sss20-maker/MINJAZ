<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خدمات منجاز الرقمية — تجريبي</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1122;color:#f6f6ff}header{padding:28px max(20px,calc((100vw - 1100px)/2));background:linear-gradient(110deg,#25205a,#111529)}h1{margin:0;font-size:clamp(26px,4vw,44px)}p{line-height:1.8;color:#c5c9df}.badge{display:inline-block;background:#393073;color:#e9d9ff;border-radius:40px;padding:6px 14px;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:#191f37;border:1px solid #353c5a;border-radius:18px;padding:20px;box-shadow:0 12px 28px #0002}.price{font-size:23px;font-weight:700;color:#a8e5d1}button{background:#8765ee;color:white;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:not-allowed}input,textarea{width:100%;padding:12px;margin:8px 0 15px;background:#10162b;color:white;border:1px solid #424b6b;border-radius:10px;font:inherit}textarea{min-height:120px}dialog{max-width:530px;width:calc(100% - 24px);background:#1b2038;color:white;border:1px solid #515d85;border-radius:18px}dialog::backdrop{background:#000a}.error{color:#ffb4b4}.muted{color:#9fa8c7}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.filters select,.filters input{width:auto;max-width:270px;margin:0;padding:10px 12px}.filters input{min-width:180px}a{color:#cbb9ff;text-underline-offset:3px}.order-details{margin-top:14px;border-top:1px solid #3c4568;padding-top:10px}@media(max-width:600px){.filters{width:100%}.filters input{flex:1;min-width:130px}.filters select{flex:1}}</style></head><body>
<header><div class="top"><div><span class="badge">نسخة تجريبية • بدون دفع</span><h1>خدمات منجاز الرقمية</h1><p>اختر الخدمة المناسبة لمشروعك، وأرسل متطلباتك بكل سهولة.</p></div><a href="/" style="color:#d8c8ff">العودة إلى منجاز ↗</a></div></header>
<main class="wrap"><div class="top"><h2>الخدمات المتاحة</h2><div class="filters"><label for="categoryFilter">التصنيف</label><select id="categoryFilter" aria-label="تصفية حسب نوع الخدمة"><option value="">جميع الخدمات</option><option value="website">المواقع</option><option value="mobile_app">التطبيقات</option><option value="ecommerce">المتاجر</option><option value="branding">الهوية</option><option value="maintenance">الصيانة</option><option value="ai">الذكاء الاصطناعي</option></select><label for="serviceSearch">بحث</label><input id="serviceSearch" type="search" placeholder="ابحث عن خدمة..." autocomplete="off"><button id="refresh">تحديث الخدمات</button></div></div><p id="status" role="status">جاري تحميل الخدمات...</p><section class="grid" id="catalog" aria-live="polite"></section><div class="top"><h2>طلباتي الرقمية</h2><button id="ordersBtn">عرض طلباتي</button></div><section id="orders" aria-live="polite"></section><div class="top"><h3>آخر تحديثات طلباتي</h3><button id="activityBtn" type="button">تحديث المتابعة</button></div><section id="activity" aria-live="polite"><p class="muted">سجّل دخولك ثم اعرض طلباتك لمتابعة تحديثاتها.</p></section></main>
<dialog id="orderDialog"><form id="orderForm"><h2 id="orderTitle">طلب خدمة</h2><label for="requirements">متطلبات المشروع (10 أحرف على الأقل)</label><textarea id="requirements" required minlength="10" maxlength="10000" placeholder="اكتب تفاصيل مشروعك، والنتيجة المطلوبة، وأي ملاحظات..."></textarea><p class="muted">هذا الطلب مسودة، ولن يتم تحصيل أي مبلغ.</p><p id="formError" class="error" role="alert"></p><button type="submit" id="submitOrder">إنشاء الطلب</button> <button type="button" id="cancel">إلغاء</button></form></dialog>
<script>
'use strict';const $=id=>document.getElementById(id);let selected=null;let pendingOrderKey=null;let ordersOpened=false;
const labels={website:'مواقع',mobile_app:'تطبيقات',ecommerce:'متاجر',branding:'هوية',maintenance:'صيانة',ai:'ذكاء اصطناعي'};
const orderStates={created:'إنشاء الطلب',draft:'مسودة',awaiting_payment:'بانتظار الدفع',paid:'تم الدفع',in_progress:'قيد التنفيذ',delivered:'تم التسليم',revision_requested:'طلب تعديل',completed:'مكتمل',cancelled:'ملغي',refunded:'مسترد'};
const errorLabels={unauthorized:'سجّل دخولك أولًا',admin_only:'هذه العملية للمدير فقط',sandbox_only:'هذه العملية متاحة في البيئة التجريبية فقط',invalid_order:'بيانات الطلب غير صحيحة',invalid_requirements:'متطلبات المشروع غير صحيحة',invalid_delivery_url:'رابط التسليم يجب أن يكون HTTPS عامًا وصحيحًا',invalid_title:'أدخل اسمًا واضحًا للملف',invalid_deliverable:'بيانات ملف التسليم غير مكتملة',duplicate_delivery_url:'هذا الرابط مضاف مسبقًا',delivery_link_limit_reached:'وصل الطلب إلى الحد الأقصى للروابط',order_not_in_progress:'يجب بدء تنفيذ الطلب أولًا',pending_link_not_found:'الرابط غير موجود أو تم تسليمه ولا يمكن سحبه',invalid_status_transition:'لا يمكن تنفيذ هذا الإجراء في الحالة الحالية',order_not_found:'الطلب غير موجود أو لا تملك صلاحية الوصول إليه',package_unavailable:'الباقة غير متاحة حاليًا',idempotency_key_reused:'تغيّرت بيانات الطلب؛ أعد فتح نافذة الطلب لإنشاء محاولة جديدة',origin_not_allowed:'تعذّر التحقق من مصدر الطلب؛ حدّث الصفحة وحاول مجددًا'};
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
async function api(path,options){const res=await fetch(path,{credentials:'same-origin',headers:{Accept:'application/json',...(options?.body?{'Content-Type':'application/json'}:{})},...options});let data;try{data=await res.json()}catch{throw Error('تعذر قراءة رد الخادم')}if(!res.ok){if(res.status===401)throw Error('سجّل دخولك أولًا من الصفحة الرئيسية لمنجاز');throw Error(errorLabels[data.error]||data.error||'حدث خطأ ('+res.status+')')}return data}
let catalogItems=[];let catalogVersion=0;
function renderCatalog(){const box=$('catalog');box.replaceChildren();const phrase=$('serviceSearch').value.trim().toLocaleLowerCase('ar');const filtered=catalogItems.filter(p=>(p.title_ar+' '+p.description_ar+' '+(labels[p.category]||'')).toLocaleLowerCase('ar').includes(phrase));$('status').textContent=filtered.length?'عدد الخدمات المعروضة: '+filtered.length:'لا توجد خدمات مطابقة لبحثك';for(const p of filtered){const card=element('article',undefined,'card');card.append(element('span',labels[p.category]||p.category,'badge'),element('h3',p.title_ar),element('p',p.description_ar),element('div',p.price_sar+' ر.س','price'),element('p','التسليم خلال '+p.delivery_days+' يوم • '+p.revision_limit+' تعديلات'));const btn=element('button','اطلب الخدمة');btn.addEventListener('click',()=>{selected=p;$('orderTitle').textContent='طلب: '+p.title_ar;$('formError').textContent='';$('requirements').value='';pendingOrderKey=crypto.randomUUID();$('orderDialog').showModal()});card.append(btn);box.append(card)}}
async function load(){const version=++catalogVersion;$('catalog').replaceChildren();$('status').textContent='جاري تحميل الخدمات...';try{const category=$('categoryFilter').value;const data=await api('/api/digital-services/catalog'+(category?'?category='+encodeURIComponent(category):''));if(version!==catalogVersion)return;if(!Array.isArray(data.services))throw Error('صيغة البيانات غير صحيحة');catalogItems=data.services;renderCatalog()}catch(e){if(version===catalogVersion)$('status').textContent='تعذر تحميل الخدمات: '+e.message}}
async function orders(){const box=$('orders');box.replaceChildren(element('p','جاري التحميل...'));try{const data=await api('/api/digital-services/orders');box.replaceChildren();if(!data.orders.length){box.append(element('p','لا توجد طلبات حتى الآن'));return}for(const o of data.orders){const card=element('article',undefined,'card');card.append(element('h3',o.title_ar),element('p','رقم الطلب: '+o.id+' • الحالة: '+(orderStates[o.status]||o.status)),element('p',o.price_sar+' ر.س'));const details=element('button','عرض التفاصيل');details.addEventListener('click',async()=>{details.disabled=true;try{const result=await api('/api/digital-services/orders/'+encodeURIComponent(o.id));const linkData=await api('/api/digital-services/orders/'+encodeURIComponent(o.id)+'/deliverables');const order=result.order;if(!order)throw Error('تعذر عرض الطلب');let info=card.querySelector('.order-details');if(!info){info=element('div',undefined,'order-details');card.append(info)}info.replaceChildren(element('p','رقم الطلب: '+order.id),element('p','الحالة: '+(orderStates[order.status]||order.status)),element('p','السعر المتفق عليه: '+order.price_sar+' ر.س'),element('p','تاريخ الإنشاء: '+new Date(order.created_at).toLocaleString('ar-SA')),element('p','متطلبات المشروع: '+(order.requirements||'غير متاحة')),element('p','التعديلات المستخدمة: '+(order.revisions_used??0)+' / '+(order.revision_limit??0)));if(order.delivery_note)info.append(element('p','ملاحظة التسليم: '+order.delivery_note));if(Array.isArray(linkData.deliverables)&&linkData.deliverables.length){info.append(element('h4','ملفات التسليم'));const list=element('ul');for(const asset of linkData.deliverables){const item=element('li');const anchor=document.createElement('a');anchor.href=asset.url;anchor.target='_blank';anchor.rel='noopener noreferrer';anchor.textContent=asset.title;item.append(anchor);list.append(item)}info.append(list)}if(Array.isArray(order.events)&&order.events.length){info.append(element('h4','سجل مراحل الطلب'));const ul=element('ul');for(const event of order.events){const label=(orderStates[event.previous_status]||event.previous_status)+' ← '+(orderStates[event.new_status]||event.new_status);ul.append(element('li',label+' • '+new Date(event.created_at).toLocaleString('ar-SA')+(event.note?' • '+event.note:'')))}info.append(ul)}if(Array.isArray(order.revisions)&&order.revisions.length){info.append(element('h4','طلبات التعديلات السابقة'));const ul=element('ul');for(const rev of order.revisions)ul.append(element('li',rev.note+' • '+new Date(rev.created_at).toLocaleString('ar-SA')));info.append(ul)}if(order.status==='delivered'){const accept=element('button','اعتماد الاستلام');accept.addEventListener('click',async()=>{if(!confirm('هل تؤكد استلام الخدمة وإكمال الطلب التجريبي؟'))return;accept.disabled=true;try{await api('/api/digital-services/orders/'+order.id+'/complete',{method:'POST',body:'{}'});await orders()}catch(error){$('status').textContent=error.message}finally{accept.disabled=false}});info.append(accept);if((order.revisions_used??0)<(order.revision_limit??0)){const note=element('textarea');note.placeholder='صف التعديلات المطلوبة بوضوح (10-3000 حرف)';note.maxLength=3000;const rev=element('button','طلب تعديل');rev.addEventListener('click',async()=>{if(note.value.trim().length<10){$('status').textContent='أدخل وصف التعديل لا يقل عن 10 أحرف';return}rev.disabled=true;try{await api('/api/digital-services/orders/'+order.id+'/revisions',{method:'POST',body:JSON.stringify({note:note.value.trim()})});await orders()}catch(error){$('status').textContent=error.message}finally{rev.disabled=false}});info.append(note,rev)}}if(order.status==='draft'){const editLabel=element('label','تعديل متطلبات المسودة قبل بدء التنفيذ');const edited=element('textarea');edited.value=order.requirements||'';edited.maxLength=10000;edited.minLength=10;edited.setAttribute('aria-label','متطلبات المشروع المعدلة');const saveRequirements=element('button','حفظ المتطلبات');saveRequirements.addEventListener('click',async()=>{const newRequirements=edited.value.trim();if(newRequirements.length<10){$('status').textContent='الحد الأدنى لمتطلبات المشروع 10 أحرف';return}if(newRequirements===order.requirements){$('status').textContent='لم تتغير المتطلبات';return}saveRequirements.disabled=true;try{await api('/api/digital-services/orders/'+order.id,{method:'PATCH',body:JSON.stringify({requirements:newRequirements})});$('status').textContent='تم حفظ متطلبات الطلب';await orders()}catch(error){$('status').textContent=error.message}finally{saveRequirements.disabled=false}});info.append(editLabel,edited,saveRequirements);const cancelOrder=element('button','إلغاء المسودة');cancelOrder.addEventListener('click',async()=>{if(!confirm('تأكيد إلغاء مسودة الطلب؟'))return;cancelOrder.disabled=true;try{await api('/api/digital-services/orders/'+order.id+'/cancel',{method:'POST',body:'{}'});await orders()}catch(error){$('status').textContent=error.message}finally{cancelOrder.disabled=false}});info.append(cancelOrder)}}catch(err){let info=card.querySelector('.order-details');if(!info){info=element('div',undefined,'order-details');card.append(info)}info.replaceChildren(element('p',err.message,'error'))}finally{details.disabled=false}});card.append(details);box.append(card)}}catch(e){box.replaceChildren(element('p',e.message,'error'))}}
async function loadActivity(){const box=$('activity');try{const data=await api('/api/digital-services/activity');if(!Array.isArray(data.activity))throw Error('تعذر قراءة تحديثات الطلبات');box.replaceChildren();if(!data.activity.length){box.append(element('p','لا توجد تحديثات تنفيذ من الإدارة حتى الآن.','muted'));return}for(const event of data.activity){const card=element('article',undefined,'card');card.append(element('h4',event.title_ar+' • طلب #'+event.order_id),element('p','الحالة: '+(orderStates[event.status]||event.status)),element('p',new Date(event.created_at).toLocaleString('ar-SA')));box.append(card)}}catch(error){box.replaceChildren(element('p',error.message,'error'))}}
$('refresh').addEventListener('click',load);$('categoryFilter').addEventListener('change',load);$('serviceSearch').addEventListener('input',renderCatalog);$('ordersBtn').addEventListener('click',async()=>{ordersOpened=true;await Promise.all([orders(),loadActivity()])});$('activityBtn').addEventListener('click',async()=>{ordersOpened=true;await loadActivity()});setInterval(()=>{if(ordersOpened&&document.visibilityState==='visible')loadActivity()},60000);$('cancel').addEventListener('click',()=>$('orderDialog').close());
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();if(!selected)return;const btn=$('submitOrder');btn.disabled=true;$('formError').textContent='';try{const result=await api('/api/digital-services/orders',{method:'POST',body:JSON.stringify({package_id:selected.id,requirements:$('requirements').value.trim(),idempotency_key:pendingOrderKey})});$('orderDialog').close();pendingOrderKey=null;alert((result.idempotent_replay?'تم استرجاع الطلب السابق رقم ':'تم إنشاء مسودة الطلب رقم ')+result.order_id);ordersOpened=true;await Promise.all([orders(),loadActivity()])}catch(err){$('formError').textContent=err.message}finally{btn.disabled=false}});load();
</script></body></html>
