<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>خدمات منجاز الرقمية — تجريبي</title><style>
:root{font-family:system-ui,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1122;color:#f6f6ff}header{padding:28px max(20px,calc((100vw - 1100px)/2));background:linear-gradient(110deg,#25205a,#111529)}h1{margin:0;font-size:clamp(26px,4vw,44px)}p{line-height:1.8;color:#c5c9df}.badge{display:inline-block;background:#393073;color:#e9d9ff;border-radius:40px;padding:6px 14px;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:25px 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:#191f37;border:1px solid #353c5a;border-radius:18px;padding:20px;box-shadow:0 12px 28px #0002}.price{font-size:23px;font-weight:700;color:#a8e5d1}button{background:#8765ee;color:white;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font:inherit}button:disabled{opacity:.5;cursor:not-allowed}input,textarea{width:100%;padding:12px;margin:8px 0 15px;background:#10162b;color:white;border:1px solid #424b6b;border-radius:10px;font:inherit}textarea{min-height:120px}dialog{max-width:530px;width:calc(100% - 24px);background:#1b2038;color:white;border:1px solid #515d85;border-radius:18px}dialog::backdrop{background:#000a}.error{color:#ffb4b4}.muted{color:#9fa8c7}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}</style></head><body>
<header><div class="top"><div><span class="badge">نسخة تجريبية • بدون دفع</span><h1>خدمات منجاز الرقمية</h1><p>اختر الخدمة المناسبة لمشروعك، وأرسل متطلباتك بكل سهولة.</p></div><a href="/" style="color:#d8c8ff">العودة إلى منجاز ↗</a></div></header>
<main class="wrap"><div class="top"><h2>الخدمات المتاحة</h2><button id="refresh">تحديث الخدمات</button></div><p id="status" role="status">جاري تحميل الخدمات...</p><section class="grid" id="catalog" aria-live="polite"></section><div class="top"><h2>طلباتي الرقمية</h2><button id="ordersBtn">عرض طلباتي</button></div><section id="orders" aria-live="polite"></section></main>
<dialog id="orderDialog"><form id="orderForm"><h2 id="orderTitle">طلب خدمة</h2><label for="requirements">متطلبات المشروع (10 أحرف على الأقل)</label><textarea id="requirements" required minlength="10" maxlength="10000" placeholder="اكتب تفاصيل مشروعك، والنتيجة المطلوبة، وأي ملاحظات..."></textarea><p class="muted">هذا الطلب مسودة، ولن يتم تحصيل أي مبلغ.</p><p id="formError" class="error" role="alert"></p><button type="submit" id="submitOrder">إنشاء الطلب</button> <button type="button" id="cancel">إلغاء</button></form></dialog>
<script>
'use strict';const $=id=>document.getElementById(id);let selected=null;
const labels={website:'مواقع',mobile_app:'تطبيقات',ecommerce:'متاجر',branding:'هوية',maintenance:'صيانة',ai:'ذكاء اصطناعي'};
const orderStates={draft:'مسودة',awaiting_payment:'بانتظار الدفع',paid:'تم الدفع',in_progress:'قيد التنفيذ',delivered:'تم التسليم',revision_requested:'طلب تعديل',completed:'مكتمل',cancelled:'ملغي',refunded:'مسترد'};
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
async function api(path,options){const res=await fetch(path,{credentials:'same-origin',headers:{Accept:'application/json',...(options?.body?{'Content-Type':'application/json'}:{})},...options});let data;try{data=await res.json()}catch{throw Error('تعذر قراءة رد الخادم')}if(!res.ok){if(res.status===401)throw Error('سجّل دخولك أولًا من الصفحة الرئيسية لمنجاز');throw Error(data.error||'حدث خطأ ('+res.status+')')}return data}
async function load(){const box=$('catalog');box.replaceChildren();$('status').textContent='جاري التحميل...';try{const data=await api('/api/digital-services/catalog');if(!Array.isArray(data.services))throw Error('صيغة البيانات غير صحيحة');$('status').textContent=data.services.length?'اختر الخدمة المناسبة':'لا توجد باقات منشورة حاليًا';for(const p of data.services){const card=element('article',undefined,'card');card.append(element('span',labels[p.category]||p.category,'badge'),element('h3',p.title_ar),element('p',p.description_ar),element('div',p.price_sar+' ر.س','price'),element('p','التسليم خلال '+p.delivery_days+' يوم • '+p.revision_limit+' تعديلات'));const btn=element('button','اطلب الخدمة');btn.addEventListener('click',()=>{selected=p;$('orderTitle').textContent='طلب: '+p.title_ar;$('formError').textContent='';$('requirements').value='';$('orderDialog').showModal()});card.append(btn);box.append(card)}}catch(e){$('status').textContent='تعذر تحميل الخدمات: '+e.message}}
async function orders(){const box=$('orders');box.replaceChildren(element('p','جاري التحميل...'));try{const data=await api('/api/digital-services/orders');box.replaceChildren();if(!data.orders.length){box.append(element('p','لا توجد طلبات حتى الآن'));return}for(const o of data.orders){const card=element('article',undefined,'card');card.append(element('h3',o.title_ar),element('p','رقم الطلب: '+o.id+' • الحالة: '+(orderStates[o.status]||o.status)),element('p',o.price_sar+' ر.س'));const details=element('button','عرض التفاصيل');details.addEventListener('click',async()=>{details.disabled=true;try{const result=await api('/api/digital-services/orders/'+encodeURIComponent(o.id));const order=result.order;if(!order)throw Error('تعذر عرض الطلب');let info=card.querySelector('.order-details');if(!info){info=element('div',undefined,'order-details');card.append(info)}info.replaceChildren(element('p','رقم الطلب: '+order.id),element('p','الحالة: '+(orderStates[order.status]||order.status)),element('p','السعر المتفق عليه: '+order.price_sar+' ر.س'),element('p','تاريخ الإنشاء: '+new Date(order.created_at).toLocaleString('ar-SA')))}catch(err){let info=card.querySelector('.order-details');if(!info){info=element('div',undefined,'order-details');card.append(info)}info.replaceChildren(element('p',err.message,'error'))}finally{details.disabled=false}});card.append(details);box.append(card)}}catch(e){box.replaceChildren(element('p',e.message,'error'))}}
$('refresh').addEventListener('click',load);$('ordersBtn').addEventListener('click',orders);$('cancel').addEventListener('click',()=>$('orderDialog').close());
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();if(!selected)return;const btn=$('submitOrder');btn.disabled=true;$('formError').textContent='';try{const result=await api('/api/digital-services/orders',{method:'POST',body:JSON.stringify({package_id:selected.id,requirements:$('requirements').value.trim()})});$('orderDialog').close();alert('تم إنشاء مسودة الطلب رقم '+result.order_id);await orders()}catch(err){$('formError').textContent=err.message}finally{btn.disabled=false}});load();
</script></body></html>
