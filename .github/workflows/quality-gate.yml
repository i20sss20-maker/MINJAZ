name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          set -euo pipefail
          python -m py_compile server.py migrate.py storage.py
          find tests -maxdepth 1 -name '*.py' -print0 | xargs -0 -r python -m py_compile

      - name: Validate runtime structure
        run: |
          set -euo pipefail
          test "$(find database/migrations -maxdepth 1 -name '*.sql' | wc -l)" -eq 10
          test "$(wc -c < server.py)" -gt 160000
          test "$(wc -c < public/index.html)" -gt 290000
          grep -q "ThreadingHTTPServer" server.py
          grep -q "/health" server.py
          grep -q "/readiness" server.py
          grep -qi "<!doctype html" public/index.html
          grep -q "migrate.py && exec python -u server.py" Dockerfile

      - name: Validate auth and demo safety invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          server = Path("server.py").read_text(encoding="utf-8")
          ui = Path("public/index.html").read_text(encoding="utf-8")

          assert "'code_length':len(code)" in server, "OTP response must expose the code length"
          assert "code=f'{secrets.randbelow(1000000):06d}'" in server, "adapter OTP must remain six digits"
          assert "code.length!==4" not in ui, "frontend must not hard-code a four-digit OTP"
          assert "otpLength" in ui and "renderOtpInputs" in ui, "frontend must render OTP length dynamically"
          assert 'id="devOtpHint"' in ui and "devOtpHint" in ui, "dev OTP hint must be controlled dynamically"
          assert "demoHostAllowed" in ui, "demo mode must be restricted to non-production hosts"
          assert "new URLSearchParams(location.search).get('demo')==='1'||" not in ui, "production must not enable demo mode from query string alone"
          print("QUALITY_AUTH_INVARIANTS_OK")
          PY
