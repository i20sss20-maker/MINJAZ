name: MINJAZ Digital Services Preview Smoke

on:
  push:
    branches:
      - feature/digital-services-geidea-sandbox
    paths:
      - 'minjaz_digital_services.py'
      - 'minjaz_digital_workflow.py'
      - 'public/digital-services*.html'
      - 'scripts/smoke_digital_services.py'
      - 'tests/test_digital*.py'
      - 'database/migrations/0*_digital_service*.sql'
      - '.github/workflows/digital-services-preview-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minjaz-digital-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.ref == 'refs/heads/feature/digital-services-geidea-sandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate deployed preview read-only routes
        env:
          MINJAZ_SMOKE_URL: https://minjaz-digital-services-api-sandbox.up.railway.app
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            echo "Read-only preview smoke attempt ${attempt}/6"
            if python scripts/smoke_digital_services.py; then
              echo "All deployed preview checks passed"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 20; fi
          done
          echo "Deployed preview did not pass smoke checks"
          exit 1
