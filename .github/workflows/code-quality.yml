name: Code Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile backend sources
        run: |
          set -euo pipefail
          python3 -m py_compile server.py migrate.py storage.py

      - name: Verify deployable source layout
        run: |
          set -euo pipefail
          test "$(wc -c < server.py)" -gt 160000
          test "$(wc -c < public/index.html)" -gt 290000
          migration_count="$(find database/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          test "$migration_count" -ge 1
          test "$(find database/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | cut -d_ -f1 | sort | uniq -d | wc -l)" -eq 0
          echo "MIGRATIONS_OK count=$migration_count"
          grep -q "ThreadingHTTPServer" server.py
          grep -q "/health" server.py
          grep -q "/readiness" server.py
          grep -q "dispute_finalized" server.py
          grep -q "privacy_request_finalized" server.py
          grep -q "kyc_managed_by_provider" server.py
          grep -qi "<!doctype html" public/index.html
          ! grep -Eq 'find database/migrations.*wc -l\)" -eq [1-9][0-9]*' Dockerfile
          cat server.parts/part*.txt > /tmp/minjaz-server-from-parts.py
          cmp -s server.py /tmp/minjaz-server-from-parts.py
          echo "SERVER_PARTS_EXACT_MATCH_OK"

      - name: Verify auth and demo safety invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.py").read_text(encoding="utf-8")
          ui = Path("public/index.html").read_text(encoding="utf-8")
          assert "'code_length':len(code)" in server
          assert "code=f'{secrets.randbelow(1000000):06d}'" in server
          assert "code.length!==4" not in ui
          assert "renderOtpInputs" in ui and "otpLength" in ui
          assert 'id="devOtpHint"' in ui
          assert "demoHostAllowed" in ui
          assert "new URLSearchParams(location.search).get('demo')==='1'||" not in ui
          assert "SESSION_COOKIE_NAME='minjaz_session'" in server
          assert "HttpOnly; SameSite=Strict" in server
          assert "/api/v1/auth/session-cookie" in server
          assert "session_token_from_headers" in server
          assert "ON_RAILWAY=bool(os.getenv('RAILWAY_ENVIRONMENT_ID') or os.getenv('RAILWAY_SERVICE_ID'))" in server
          assert "self.headers.get('X-Real-IP')" in server
          assert "ipaddress.ip_address" in server
          assert "ip=self.client_ip()" in server
          assert "from decimal import Decimal, ROUND_HALF_UP" in server
          assert "def money_decimal(value):" in server
          assert "fee=money_decimal(Decimal(str(x['price']))*FEE/Decimal('100'))" in server
          assert "def insert_attachments_tx(cur,uploaded_by,cleaned_attachments" in server
          assert "def deliver_order_atomic(oid,user_id,note,attachments=None,idempotency_key=None,idempotency_fingerprint=None):" in server
          assert "def request_revision_atomic(oid,user_id,note,idempotency_key=None,idempotency_fingerprint=None):" in server
          assert "def complete_order_atomic(oid,user_id,idempotency_key=None,idempotency_fingerprint=None):" in server
          assert "def open_dispute_atomic(oid,user_id,reason,details=None,idempotency_key=None,idempotency_fingerprint=None):" in server
          assert "def open_cancellation_atomic(oid,user_id,reason,details=None,idempotency_key=None,idempotency_fingerprint=None):" in server
          assert "def upsert_task_invitation_atomic(task_id,client_id,freelancer_id,note=None):" in server
          assert "def upsert_proposal_atomic(task_id,freelancer_id,price,delivery_hours,revisions,message):" in server
          assert "def close_task_atomic(task_id,client_id):" in server
          assert "def withdraw_proposal_atomic(task_id,freelancer_id):" in server
          assert "def create_order_atomic(proposal_id,client_id):" in server
          assert "def pay_mock_atomic(oid,user_id):" in server
          assert "def upsert_review_atomic(oid,user_id,quality,timeliness,communication,comment=None):" in server
          assert "from freelancer_portfolio_items where freelancer_id=%s" in server
          assert "from freelancer_portfolio where freelancer_id=%s" not in server
          assert "def legal_action_precondition(user_id):" in server
          assert server.count("if legal_block:return self.sendj(428,legal_block)") >= 4
          assert "'legal_acceptance_required'" in server
          assert "def create_task_atomic(" in server
          assert "def repeat_task_atomic(" in server
          assert "def repeat_task_fingerprint(" in server
          assert "__repeatTaskPendingKeys" in ui
          assert "def task_request_fingerprint(" in server
          assert "idempotency_key_reused" in server
          assert "task_idempotency_keys" in server
          assert "__taskCreateIdempotencyKey" in ui
          assert "الدعوة مرسلة مسبقًا" in ui
          assert "def create_message_atomic(" in server
          assert "def message_request_fingerprint(" in server
          assert "message_idempotency_keys" in server
          assert "__messagePendingPayloads" in ui
          assert "def claim_order_action_idempotency(" in server
          assert "def order_action_request_fingerprint(" in server
          assert "order_action_idempotency_keys" in server
          assert "__deliveryPendingPayloads" in ui
          assert "__revisionPendingPayloads" in ui
          assert "__completePendingKeys" in ui
          assert "__disputePendingPayloads" in ui
          assert "__cancellationPendingPayloads" in ui
          assert "def create_safety_report_atomic(" in server
          assert "__safetyPendingPayloads" in ui
          assert "def create_support_ticket_atomic(" in server
          assert "def create_privacy_request_atomic(" in server
          assert "account_request_idempotency_keys" in server
          assert "__supportPendingPayload" in ui
          assert "__privacyPendingPayload" in ui
          review_start=server.index("def upsert_review_atomic")
          proposal_upsert_start=server.index("def upsert_proposal_atomic")
          close_task_start=server.index("def close_task_atomic")
          withdraw_start=server.index("def withdraw_proposal_atomic")
          create_start=server.index("def create_order_atomic")
          proposal_upsert_block=server[proposal_upsert_start:close_task_start]
          close_task_block=server[close_task_start:withdraw_start]
          withdraw_block=server[withdraw_start:create_start]
          assert "select id,client_id,status from tasks where id=%s for update" in proposal_upsert_block
          assert "on conflict(task_id,freelancer_id) do update" in proposal_upsert_block
          assert "status='sent'" in proposal_upsert_block
          assert "select id,client_id,status from tasks where id=%s for update" in close_task_block
          assert "select freelancer_id,status from proposals where task_id=%s for update" in close_task_block
          assert "update proposals set status='rejected'" in close_task_block
          assert "update tasks set status='cancelled',updated_at=now()" in close_task_block
          assert "select id,status from tasks where id=%s for update" in withdraw_block
          assert "select id,task_id,freelancer_id,status from proposals where task_id=%s and freelancer_id=%s for update" in withdraw_block
          assert withdraw_block.index("select id,status from tasks where id=%s for update") < withdraw_block.index("select id,task_id,freelancer_id,status from proposals where task_id=%s and freelancer_id=%s for update")
          assert "select 1 from orders where proposal_id=%s limit 1" in withdraw_block
          assert "delete from proposals where id=%s" in withdraw_block
          review_block=server[review_start:server.index("def deliver_order_atomic")]
          assert "from orders o where o.id=%s for update" in review_block
          assert "select * from reviews where order_id=%s for update" in review_block
          assert "'state':'unchanged'" in review_block
          pay_mock_start=server.index("def pay_mock_atomic")
          create_block=server[create_start:pay_mock_start]
          pay_mock_block=server[pay_mock_start:server.index("def deliver_order_atomic")]
          task_lock="select id,client_id,status from tasks where id=%s for update"
          proposal_lock="select * from proposals where id=%s and task_id=%s for update"
          assert task_lock in create_block and proposal_lock in create_block
          assert create_block.index(task_lock) < create_block.index(proposal_lock)
          assert "order_exists" in create_block
          assert "for update of o,t" in pay_mock_block
          assert "payment_status='paid',status='in_progress'" in pay_mock_block
          for name in ("deliver_order_atomic","request_revision_atomic","complete_order_atomic","open_dispute_atomic","open_cancellation_atomic"):
              start=server.index("def "+name)
              end=server.find("\ndef ",start+5)
              block=server[start:end if end!=-1 else len(server)]
              assert "for update of o,t" in block
          assert "def update_payout_status(pid,status,admin_note=None):" in server
          payout_start=server.index("def update_payout_status")
          dispute_helper_start=server.index("def admin_transition_dispute")
          cancellation_helper_start=server.index("def admin_transition_cancellation")
          support_helper_start=server.index("def update_support_ticket")
          privacy_helper_start=server.index("def update_privacy_request")
          payout_block=server[payout_start:dispute_helper_start]
          dispute_helper=server[dispute_helper_start:cancellation_helper_start]
          cancellation_helper=server[cancellation_helper_start:support_helper_start]
          support_helper=server[support_helper_start:privacy_helper_start]
          privacy_helper=server[privacy_helper_start:server.index("def friendly_device")]
          assert "def update_manual_kyc_status(uid,status):" in server
          kyc_manual_start=server.index("def update_manual_kyc_status")
          payout_start=server.index("def update_payout_status")
          kyc_manual_block=server[kyc_manual_start:payout_start]
          payout_block=server[payout_start:dispute_helper_start]
          user_lock="select id from users where id=%s for update"
          profile_lock="select kyc_status from freelancer_profiles where user_id=%s for update"
          assert user_lock in kyc_manual_block
          assert "select * from freelancer_profiles where user_id=%s for update" in kyc_manual_block
          assert user_lock in payout_block and profile_lock in payout_block
          assert payout_block.index(user_lock) < payout_block.index(profile_lock)
          assert "status in ('processing','paid')" in payout_block and "kyc_required" in payout_block
          assert "payout_finalized" in payout_block
          assert "for update of d,o" in dispute_helper
          assert "dispute_finalized" in dispute_helper
          assert "for update of cr,o" in cancellation_helper
          assert "cancellation_finalized" in cancellation_helper
          assert "select * from support_tickets where id=%s for update" in support_helper
          assert "return {k:as_json(v) for k,v in dict(ticket).items()},dict(ticket),False,None" in support_helper
          assert "select * from privacy_requests where id=%s for update" in privacy_helper
          assert "privacy_request_finalized" in privacy_helper
          assert "return {k:as_json(v) for k,v in dict(pr).items()},dict(pr),False,None" in privacy_helper
          pay_start=server.index("def apply_payment_adapter_event")
          kyc_start=server.index("def apply_kyc_adapter_event")
          pay_block=server[pay_start:kyc_start]
          kyc_block=server[kyc_start:server.index("def _match_text")]
          assert pay_block.index("payment_event_conflict") < pay_block.index("if ev and ev.get('processed_at')")
          assert kyc_block.index("kyc_event_conflict") < kyc_block.index("if ev and ev.get('processed_at')")
          assert "price=float(" not in server
          assert "fee=round(float(" not in server
          assert "RELEASE_COMMIT=os.getenv('RAILWAY_GIT_COMMIT_SHA','').strip()" in server
          assert "'release_commit':RELEASE_COMMIT_SHORT or None" in server
          assert "'deployment_service':DEPLOYMENT_SERVICE or None" in server
          assert "'deployment_environment':DEPLOYMENT_ENVIRONMENT or None" in server
          assert "closeTaskByClient" in ui
          assert "/api/v1/tasks/'+id+'/close" in ui
          assert "o.status==='awaiting_payment'&&o.payment_status==='unpaid'" in ui
          assert "o.status==='completed'&&!o.review_id" in ui
          assert "★ إضافة التقييم" in ui
          assert "editReview" in ui
          assert "تعديل التقييم" in ui
          assert "تقييم العميل" in ui
          assert "reviewAvg.toFixed(1)" in ui
          assert "credentials:'same-origin'" in ui
          assert "if(DEMO_MODE){token=j.token;localStorage.setItem('minjaz_token',token)}else{token='';localStorage.removeItem('minjaz_token')}" in ui
          print("MINJAZ_AUTH_UI_INVARIANTS_OK")
          PY

      - name: Parse inline frontend JavaScript
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("no inline scripts found")
          Path("/tmp/minjaz-inline.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          print("INLINE_SCRIPTS", len(scripts))
          PY
          node --check /tmp/minjaz-inline.js

      - name: Compile E2E test suites
        run: |
          set -euo pipefail
          find tests -maxdepth 1 -name '*.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Quality gate passed
        run: echo "MINJAZ_CODE_QUALITY_OK"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minjaz
          POSTGRES_PASSWORD: minjaz
          POSTGRES_DB: minjaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minjaz -d minjaz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://minjaz:minjaz@127.0.0.1:5432/minjaz
      AUTH_SECRET: ci-auth-secret-at-least-32-characters-long
      APP_ENV: beta
      SMS_MODE: dev
      DEV_OTP: "1234"
      PAYMENT_MODE: mock
      KYC_MODE: manual
      ADMIN_PHONE: "+966599999995"
      DB_PERSISTENCE: persistent
      SOURCE_CONTROL: github
      STORAGE_MODE: postgres_dev
      RUN_RUNTIME_SCHEMA_ENSURE: "0"
      PUBLIC_BASE_URL: http://127.0.0.1:3000
      CORS_ORIGINS: http://127.0.0.1:3000
      PORT: "3000"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependency
        run: pip install psycopg2-binary

      - name: Apply database migrations
        run: python migrate.py

      - name: Start MINJAZ test server
        run: |
          set -euo pipefail
          python -u server.py > /tmp/minjaz-ci.log 2>&1 &
          echo $! > /tmp/minjaz-ci.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              echo "MINJAZ_CI_SERVER_READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/minjaz-ci.log
          exit 1

      - name: Run full marketplace journey E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_EXIT_AFTER_RUN: "1"
        run: python tests/e2e_marketplace.py

      - name: Run order transition concurrency E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_EXIT_AFTER_RUN: "1"
        run: python tests/e2e_order_transition_concurrency.py

      - name: Run order creation and payment concurrency E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_EXIT_AFTER_RUN: "1"
        run: python tests/e2e_order_create_payment_concurrency.py

      - name: Run KYC payout consistency E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_ADMIN_PHONE: "+966599999995"
          E2E_EXIT_AFTER_RUN: "1"
        run: python tests/e2e_kyc_payout_consistency.py

      - name: Run admin operations E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_ADMIN_PHONE: "+966599999995"
          E2E_EXIT_AFTER_RUN: "1"
        run: python tests/e2e_operations.py

      - name: Run safety report idempotency E2E
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: python tests/e2e_safety_idempotency.py

      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/minjaz-ci.log || true
