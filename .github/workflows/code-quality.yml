name: Code Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Compile backend sources
        run: |
          set -euo pipefail
          python3 -m py_compile server.py migrate.py storage.py

      - name: Verify deployable source layout
        run: |
          set -euo pipefail
          test "$(wc -c < server.py)" -gt 160000
          test "$(wc -c < public/index.html)" -gt 290000
          migration_count="$(find database/migrations -maxdepth 1 -name '*.sql' | wc -l)"
          test "$migration_count" -ge 1
          test "$(find database/migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | cut -d_ -f1 | sort | uniq -d | wc -l)" -eq 0
          echo "MIGRATIONS_OK count=$migration_count"
          grep -q "ThreadingHTTPServer" server.py
          grep -q "/health" server.py
          grep -q "/readiness" server.py
          grep -q "dispute_finalized" server.py
          grep -q "privacy_request_finalized" server.py
          grep -q "kyc_managed_by_provider" server.py
          grep -qi "<!doctype html" public/index.html
          ! grep -Eq 'find database/migrations.*wc -l\)" -eq [1-9][0-9]*' Dockerfile

      - name: Verify auth and demo safety invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          server = Path("server.py").read_text(encoding="utf-8")
          ui = Path("public/index.html").read_text(encoding="utf-8")
          assert "'code_length':len(code)" in server
          assert "code=f'{secrets.randbelow(1000000):06d}'" in server
          assert "code.length!==4" not in ui
          assert "renderOtpInputs" in ui and "otpLength" in ui
          assert 'id="devOtpHint"' in ui
          assert "demoHostAllowed" in ui
          assert "new URLSearchParams(location.search).get('demo')==='1'||" not in ui
          assert "SESSION_COOKIE_NAME='minjaz_session'" in server
          assert "HttpOnly; SameSite=Strict" in server
          assert "/api/v1/auth/session-cookie" in server
          assert "session_token_from_headers" in server
          assert "ON_RAILWAY=bool(os.getenv('RAILWAY_ENVIRONMENT_ID') or os.getenv('RAILWAY_SERVICE_ID'))" in server
          assert "self.headers.get('X-Real-IP')" in server
          assert "ipaddress.ip_address" in server
          assert "ip=self.client_ip()" in server
          assert "from decimal import Decimal, ROUND_HALF_UP" in server
          assert "def money_decimal(value):" in server
          assert "fee=money_decimal(Decimal(str(x['price']))*FEE/Decimal('100'))" in server
          assert "def update_payout_status(pid,status,admin_note=None):" in server
          payout_start=server.index("def update_payout_status")
          dispute_helper_start=server.index("def admin_transition_dispute")
          cancellation_helper_start=server.index("def admin_transition_cancellation")
          payout_block=server[payout_start:dispute_helper_start]
          dispute_helper=server[dispute_helper_start:cancellation_helper_start]
          cancellation_helper=server[cancellation_helper_start:server.index("def friendly_device")]
          assert "select * from payout_requests where id=%s for update" in payout_block
          assert "payout_finalized" in payout_block
          assert "for update of d,o" in dispute_helper
          assert "dispute_finalized" in dispute_helper
          assert "for update of cr,o" in cancellation_helper
          assert "cancellation_finalized" in cancellation_helper
          assert "def create_order_from_proposal(client_id,proposal_id):" in server
          order_helper_start=server.index("def create_order_from_proposal")
          order_helper_end=server.index("def friendly_device")
          order_helper=server[order_helper_start:order_helper_end]
          assert "for update of t,p" in order_helper
          assert "'order_exists'" in order_helper
          assert "create_order_from_proposal(u['id'],b.get('proposal_id'))" in server
          assert "ex=q('select id from orders where task_id=%s'" not in server
          pay_start=server.index("def apply_payment_adapter_event")
          kyc_start=server.index("def apply_kyc_adapter_event")
          pay_block=server[pay_start:kyc_start]
          kyc_block=server[kyc_start:server.index("def _match_text")]
          assert pay_block.index("payment_event_conflict") < pay_block.index("if ev and ev.get('processed_at')")
          assert kyc_block.index("kyc_event_conflict") < kyc_block.index("if ev and ev.get('processed_at')")
          assert "price=float(" not in server
          assert "fee=round(float(" not in server
          assert "credentials:'same-origin'" in ui
          assert "if(DEMO_MODE){token=j.token;localStorage.setItem('minjaz_token',token)}else{token='';localStorage.removeItem('minjaz_token')}" in ui
          print("MINJAZ_AUTH_UI_INVARIANTS_OK")
          PY

      - name: Parse inline frontend JavaScript
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("no inline scripts found")
          Path("/tmp/minjaz-inline.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          print("INLINE_SCRIPTS", len(scripts))
          PY
          node --check /tmp/minjaz-inline.js

      - name: Compile E2E test suites
        run: |
          set -euo pipefail
          find tests -maxdepth 1 -name '*.py' -print0 | xargs -0 -r python3 -m py_compile

      - name: Quality gate passed
        run: echo "MINJAZ_CODE_QUALITY_OK"
