name: Production Smoke

on:
  push:
    branches: [main]
    paths:
      - "server.py"
      - "migrate.py"
      - "storage.py"
      - "database/**"
      - "public/**"
      - "Dockerfile"
      - ".dockerignore"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify MINJAZ production candidate
        env:
          BASE: https://minjaz-app-prod-production.up.railway.app
        run: |
          set -euo pipefail

          expected="${GITHUB_SHA:0:12}"
          for i in $(seq 1 40); do
            curl -fsS --max-time 12 "$BASE/health" -o health.json || true
            current=$(jq -r '.release_commit // ""' health.json 2>/dev/null || true)
            if [ "$current" = "$expected" ]; then
              break
            fi
            sleep 3
          done
          test "$(jq -r '.release_commit // ""' health.json)" = "$expected"

          health=""
          for i in $(seq 1 25); do
            if health=$(curl -fsS --max-time 12 "$BASE/health" 2>/dev/null); then
              if echo "$health" | jq -e '.ok==true and .database==true and .version=="0.5.5-rc5"' >/dev/null; then
                break
              fi
            fi
            sleep 3
          done
          echo "$health" | jq -e '.ok==true and .database==true and .version=="0.5.5-rc5"' >/dev/null
          echo "$health" | jq -r '"HEALTH_OK version="+.version+" db_latency_ms="+(.database_latency_ms|tostring)'

          readiness=$(curl -fsS --retry 5 --retry-delay 2 --max-time 12 "$BASE/readiness")
          echo "$readiness" | jq -e '.ready_for_beta==true' >/dev/null
          echo "$readiness" | jq -r '"COMMERCIAL_READY="+(.ready_for_commercial_launch|tostring)'
          echo "$readiness" | jq -r '[.checks[]|select(.required==true and .ok==false)|.key]|"COMMERCIAL_BLOCKERS="+(join(",") // "none")'

          categories=$(curl -fsS --retry 5 --retry-delay 2 --max-time 12 "$BASE/api/v1/categories")
          echo "$categories" | jq -e '(.items|length)>0' >/dev/null
          services=$(curl -fsS --retry 5 --retry-delay 2 --max-time 12 "$BASE/api/v1/services")
          echo "$services" | jq -e '(.items|length)>=50' >/dev/null

          curl -fsS --retry 5 --retry-delay 2 --max-time 12 "$BASE/" -o index.html
          test "$(wc -c < index.html)" -gt 290000
          grep -q 'applyServiceTemplate' index.html
          grep -q 'switchMinjazRole' index.html
          grep -q 'مِنجاز' index.html

          curl -fsS --retry 5 --retry-delay 2 "$BASE/manifest.webmanifest" -o manifest.webmanifest
          curl -fsS --retry 5 --retry-delay 2 "$BASE/sw.js" -o sw.js
          test -s manifest.webmanifest
          test -s sw.js
          curl -fsS --retry 5 --retry-delay 2 "$BASE/minjaz-work-center-v31.js" -o work-center.js
          curl -fsS --retry 5 --retry-delay 2 "$BASE/minjaz-work-center-v31.css" -o work-center.css
          curl -fsS --retry 5 --retry-delay 2 "$BASE/minjaz-files-demo-v302.js" -o files-demo.js
          curl -fsS --retry 5 --retry-delay 2 "$BASE/minjaz-release-v316.js" -o release-v316.js
          curl -fsS --retry 5 --retry-delay 2 "$BASE/privacy" -o privacy.html
          curl -fsS --retry 5 --retry-delay 2 "$BASE/account-deletion" -o account-deletion.html
          grep -q "renderWorkCenterV31" work-center.js
          grep -q "workCenterV31" work-center.css
          grep -q "/api/v1/files" files-demo.js
          grep -q "/minjaz-work-center-v31.js" index.html
          grep -q "/minjaz-release-v316.js" index.html
          grep -q "openAccountDeletionV316" release-v316.js
          grep -q "سياسة الخصوصية" privacy.html
          grep -q "حذف حساب مِنجاز" account-deletion.html
          grep -q "web-v31.6" sw.js

          curl -fsS -D headers.txt -o /dev/null -H "Origin: $BASE" "$BASE/health"
          grep -qi "access-control-allow-origin: $BASE" headers.txt
          grep -qi "x-frame-options: DENY" headers.txt
          grep -qi "content-security-policy:" headers.txt

          curl -fsS -D evil.txt -o /dev/null -H "Origin: https://evil.example" "$BASE/health"
          ! grep -qi "access-control-allow-origin:" evil.txt

          code=$(curl -sS -o unauth.json -w "%{http_code}" "$BASE/api/v1/me")
          test "$code" = "401"
          jq -e '.error=="unauthorized" and (.request_id|length)>0' unauth.json >/dev/null

          echo "MINJAZ_PRODUCTION_SMOKE_OK"
