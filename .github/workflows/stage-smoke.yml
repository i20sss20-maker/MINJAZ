name: Stage Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check MINJAZ stage from public internet
        env:
          BASE: https://minjaz-stage-source-production.up.railway.app
        run: |
          set -euo pipefail
          expected="${GITHUB_SHA:0:12}"
          for i in $(seq 1 40); do
            curl -fsS --max-time 12 "$BASE/health" -o health.json || true
            current=$(jq -r '.release_commit // ""' health.json 2>/dev/null || true)
            if [ "$current" = "$expected" ]; then
              break
            fi
            sleep 3
          done
          test "$(jq -r '.release_commit // ""' health.json)" = "$expected"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$BASE/health" -o health.json
          python3 - <<'PY'
          import json
          h=json.load(open("health.json"))
          assert h.get("ok") is True, h
          assert h.get("version")=="0.5.5-rc5", h
          print("HEALTH_OK", h.get("version"))
          PY
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors "$BASE/" -o index.html
          test "$(wc -c < index.html)" -gt 290000
          grep -Eqi '<!doctype html|<html' index.html
          test "$(tr -d '\r\n ' < index.html)" != "OK"
          curl -fsS --retry 5 --retry-delay 2 "$BASE/manifest.webmanifest" -o manifest.webmanifest
          curl -fsS --retry 5 --retry-delay 2 "$BASE/sw.js" -o sw.js
          test -s manifest.webmanifest
          test -s sw.js
          curl -fsS --retry 5 --retry-delay 2 "$BASE/minjaz-work-center-v31.js" -o work-center.js
          curl -fsS --retry 5 --retry-delay 2 "$BASE/minjaz-work-center-v31.css" -o work-center.css
          curl -fsS --retry 5 --retry-delay 2 "$BASE/minjaz-files-demo-v302.js" -o files-demo.js
          curl -fsS --retry 5 --retry-delay 2 "$BASE/minjaz-push-v312.js" -o push-runtime.js
          grep -q "renderWorkCenterV31" work-center.js
          grep -q "workCenterV31" work-center.css
          grep -q "/api/v1/files" files-demo.js
          grep -q "enableMinjazPushV312" push-runtime.js
          grep -q "/api/v1/push/config" push-runtime.js
          grep -q "/minjaz-push-v312.js" index.html
          grep -q "/minjaz-work-center-v31.js" index.html
          grep -q "web-v31.2" sw.js
          echo "PUBLIC_STAGE_OK index_bytes=$(wc -c < index.html) manifest_bytes=$(wc -c < manifest.webmanifest) sw_bytes=$(wc -c < sw.js)"
