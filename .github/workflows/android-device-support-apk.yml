name: Android Device Support APK

on:
  push:
    branches:
      - main
      - android-device-support-v2
      - android-compat-only-v3
      - android-stability-v04
      - android-resilience-v05
      - android-edge-to-edge-v06
    paths:
      - 'android-preview/**'
      - '.github/workflows/android-device-support-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: android-preview
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Run Android lint
        working-directory: android-preview
        run: gradle --no-daemon :app:lintDebug

      - name: Verify manifest and package
        shell: bash
        run: |
          set -euo pipefail
          APK="android-preview/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          aapt dump badging "$APK" | tee /tmp/minjaz-badging.txt
          grep -q "package: name='sa.minjaz.preview'" /tmp/minjaz-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/minjaz-badging.txt
          grep -q "sdkVersion:'24'" /tmp/minjaz-badging.txt
          sha256sum "$APK" | tee /tmp/MINJAZ-device-support.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MINJAZ-device-support-apk
          path: |
            android-preview/app/build/outputs/apk/debug/app-debug.apk
            /tmp/MINJAZ-device-support.apk.sha256
          if-no-files-found: error
          retention-days: 7
