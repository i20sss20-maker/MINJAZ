name: MINJAZ Marketplace Launch Foundation
on:
  push:
    branches:
      - feature/minjaz-real-launch-foundation-20261027
  pull_request:
    branches:
      - feature/digital-services-geidea-sandbox
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minjaz-launch-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-contract:
    name: Existing services + secure email + request publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check psycopg2-binary
      - name: Validate Python application
        run: python -m py_compile server.py minjaz_account_auth.py minjaz_email_auth.py minjaz_digital_services.py minjaz_digital_workflow.py
      - name: Validate all inline JavaScript and email registration UI
        run: |
          node --check public/minjaz-account-registration-v1.js
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          html = Path("public/index.html").read_text(encoding="utf-8")
          snippets = re.findall(r"<script[^>]*>(.*?)</script>", html, re.S|re.I)
          for index, snippet in enumerate(snippets,1):
              if not snippet.strip(): continue
              subprocess.run(["node","--check"], input=snippet, text=True, check=True)
          if len(snippets)<30:
              raise AssertionError("Expected established MINJAZ frontend, but found too few scripts")
          print("Validated", len(snippets), "inline JavaScript scripts")
          PY
      - name: Run existing unit and new marketplace safety regression checks
        run: python -m unittest discover -s tests -p 'test_digital*.py' -v

  account-db-contract:
    name: Registration and recovery on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digital_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL test driver
        run: python -m pip install --disable-pip-version-check psycopg2-binary
      - name: Test email registration, verification, password recovery and roles
        env:
          MINJAZ_ACCOUNT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/account_test
        run: python scripts/test_minjaz_accounts_postgres.py
      - name: Test digital service order lifecycle
        env:
          DIGITAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/digital_test
        run: python scripts/test_digital_postgres_integration.py
