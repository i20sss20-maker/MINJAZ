name: Android APK Preview

on:
  push:
    branches: [android-apk-preview]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f android-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MINJAZ-Android-Preview
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
